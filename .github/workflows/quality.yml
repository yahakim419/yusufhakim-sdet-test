name: Quality net

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dor-gate:
    name: dor-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json body -q .body > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - name: Check Definition of Ready
        run: |
          chmod +x .github/scripts/check-dor.sh
          .github/scripts/check-dor.sh /tmp/pr-body.md

  external-e2e:
    name: external-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakamin_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: development
      SECRET_KEY_BASE: test_secret_key_base_for_github_actions_ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: rakamin_development
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      TOKEN_EXPIRATION_TIME: "259200"
      WEB_CONCURRENCY: "0"
      BASE_URL: http://127.0.0.1:3001
      E2E_EMAIL: admin@test-corp.example
      E2E_PASSWORD: Password1!
      X_TENANT_SCHEME: test-corp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libpq-dev jq

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
          working-directory: api

      - name: Write API config
        working-directory: api
        run: |
          cat > config/application.yml <<'EOF'
          SECRET_KEY_BASE: test_secret_key_base_for_github_actions_ci
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: rakamin_development
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/1
          TOKEN_EXPIRATION_TIME: "259200"
          APP_BASE_URL: http://localhost:3001
          ALLOWED_ORIGINS: "*"
          GEMINI_API_KEY: unused
          GEMINI_LIVE_MODEL: gemini-2.0-flash-live-001
          GEMINI_FLASH_MODEL: gemini-2.0-flash-001
          GEMINI_PRO_MODEL: gemini-2.0-pro-001
          EOF
          sed -i 's/^[[:space:]]*//' config/application.yml

      - name: Run external e2e (TC-E2E-001…008)
        run: |
          chmod +x .github/scripts/run-external-e2e.sh
          .github/scripts/run-external-e2e.sh

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [dor-gate, external-e2e]
    if: always()
    steps:
      - name: Require quality jobs
        run: |
          e2e="${{ needs.external-e2e.result }}"
          dor="${{ needs.dor-gate.result }}"
          echo "dor-gate=$dor external-e2e=$e2e"
          if [[ "$e2e" != "success" ]]; then
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "pull_request" && "$dor" != "success" ]]; then
            exit 1
          fi
          echo "Quality net passed (DoR + external e2e)."
