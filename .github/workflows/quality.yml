name: Quality net

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dor-gate:
    name: dor-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json body -q .body > /tmp/pr-body.md
          cat /tmp/pr-body.md

      - name: Check Definition of Ready
        run: |
          chmod +x .github/scripts/check-dor.sh
          .github/scripts/check-dor.sh /tmp/pr-body.md

  api-e2e:
    name: api-e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakamin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: test_secret_key_base_for_github_actions_ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: rakamin_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/1
      TOKEN_EXPIRATION_TIME: "259200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
          working-directory: api

      - name: Prepare database
        run: |
          cat > config/application.yml <<'EOF'
          SECRET_KEY_BASE: test_secret_key_base_for_github_actions_ci
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: rakamin_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/1
          TOKEN_EXPIRATION_TIME: "259200"
          APP_BASE_URL: http://localhost:3001
          ALLOWED_ORIGINS: "*"
          GEMINI_API_KEY: unused
          GEMINI_LIVE_MODEL: gemini-2.0-flash-live-001
          GEMINI_FLASH_MODEL: gemini-2.0-flash-001
          GEMINI_PRO_MODEL: gemini-2.0-pro-001
          EOF
          # Strip leading indentation from the heredoc body
          sed -i 's/^[[:space:]]*//' config/application.yml
          bundle exec rails db:prepare

      - name: Run e2e business-flow specs
        run: bundle exec rspec spec/requests/e2e_business_flow_spec.rb --format documentation

  web-payload:
    name: web-payload
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run assessment payload unit tests
        run: npm test

  quality:
    name: quality
    runs-on: ubuntu-latest
    needs: [dor-gate, api-e2e, web-payload]
    if: always()
    steps:
      - name: Require quality jobs
        run: |
          e2e="${{ needs.api-e2e.result }}"
          web="${{ needs.web-payload.result }}"
          dor="${{ needs.dor-gate.result }}"
          echo "dor-gate=$dor api-e2e=$e2e web-payload=$web"
          if [[ "$e2e" != "success" || "$web" != "success" ]]; then
            exit 1
          fi
          # dor-gate is required on PRs; on push to main it is skipped
          if [[ "${{ github.event_name }}" == "pull_request" && "$dor" != "success" ]]; then
            exit 1
          fi
          echo "Quality net passed."
