name: Lint

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-lint:
    name: api-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.2"
          bundler-cache: true
          working-directory: api

      - name: Run RuboCop
        run: bundle exec rubocop

  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: [api-lint, web-lint]
    if: always()
    steps:
      - name: Require api-lint and web-lint to pass
        run: |
          if [ "${{ needs.api-lint.result }}" != "success" ] || [ "${{ needs.web-lint.result }}" != "success" ]; then
            echo "api-lint=${{ needs.api-lint.result }} web-lint=${{ needs.web-lint.result }}"
            exit 1
          fi
          echo "All lint jobs passed."
