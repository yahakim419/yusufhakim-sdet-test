# Cross-platform local stack (Mac + Windows via Docker Desktop).
# Usage: from repo root, prefer docker/up.sh or docker/up.ps1
name: yusufhakim-sdet

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rakamin_development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rakamin_development}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../api
      dockerfile: ../docker/Dockerfile.api
    entrypoint: ["/bin/bash", "/docker-entrypoint.sh"]
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-rakamin_development}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/1
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      TOKEN_EXPIRATION_TIME: ${TOKEN_EXPIRATION_TIME:-259200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-2.0-flash-live-001}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-2.0-flash-001}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-2.0-pro-001}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-0}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - ./api-entrypoint.sh:/docker-entrypoint.sh:ro
      - ../api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # TCP-only: /health returns 500 until migrations run.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3001'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  sidekiq:
    build:
      context: ../api
      dockerfile: ../docker/Dockerfile.api
    entrypoint: ["/bin/bash", "/docker-entrypoint.sh"]
    command: ["bundle", "exec", "sidekiq", "-r", "./config/environment.rb", "-C", "config/sidekiq.yml"]
    env_file:
      - .env
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-rakamin_development}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/1
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      TOKEN_EXPIRATION_TIME: ${TOKEN_EXPIRATION_TIME:-259200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your_gemini_api_key}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-2.0-flash-live-001}
      GEMINI_FLASH_MODEL: ${GEMINI_FLASH_MODEL:-gemini-2.0-flash-001}
      GEMINI_PRO_MODEL: ${GEMINI_PRO_MODEL:-gemini-2.0-pro-001}
    volumes:
      - ./api-entrypoint.sh:/docker-entrypoint.sh:ro
      - ../api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: ../web
      dockerfile: ../docker/Dockerfile.web
    entrypoint: ["/bin/bash", "/docker-entrypoint.sh"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: http://localhost:3001/api/v1
      VITE_WS_BASE_URL: ws://localhost:3001
      VITE_DEV_TENANT_ID: "1"
      VITE_DEV_TENANT_NAME: Demo Tenant
      VITE_DEV_TOKEN: ${VITE_DEV_TOKEN:-}
    ports:
      - "5173:5173"
    volumes:
      - ./web-entrypoint.sh:/docker-entrypoint.sh:ro
      - ../web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  web_node_modules:
